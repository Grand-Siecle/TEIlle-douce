[build-system]
# 77 et non 68 : la licence est declaree en chaine SPDX et
# `license-files` est une cle de premier niveau — PEP 639, que
# setuptools n'accepte qu'a partir de 77. En dessous, un
# `pip install --no-build-isolation -e .` echoue sur une erreur
# de schema difficile a lire.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teille-douce"
description = "Convert ALTO XML from OCR/HTR into TEI P5 with the SegmOnto taxonomy"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]

# Le socle du pipeline. Python 3.12 minimum : lingua-language-detector 2.2
# exige >=3.12 et pandas 3.0 >=3.11 (la CI epingle 3.12 pour cette raison).
#
# lingua est epingle a l'exact : la detection de langue CHANGE de resultat
# d'une version mineure a l'autre (constate de 2.1 a 2.2), et le test E2E
# compare le TEI produit au golden caractere par caractere — un run
# reproductible ne doit pas dependre de la date d'installation.
# Les autres bornes arretent la majeure suivante ; httpx est en 0.x, ou
# la rupture se joue sur la mineure.
dependencies = [
    "lxml>=6.0,<7",
    "pandas>=3.0,<4",
    "rich>=14.0,<15",
    "lingua-language-detector==2.2.0",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
# Ce que la CI installe : le socle + de quoi lancer la suite. Ni modeles
# NER ni services : la suite par defaut tourne sans reseau.
#
# SaxonC-HE : moteur XSLT 2.0 sans JVM. Necessaire pour compiler l'ODD
# (scripts/build_odd.py) et pour appliquer le Schematron qui en derive --
# la TEI le produit en queryBinding="xslt2", que lxml ne sait pas executer.
# La validation RelaxNG contre schema/teille-douce.rng, elle, n'en depend pas.
dev = [
    "pytest>=9.0,<10",
    "coverage>=7.15,<8",
    "saxonche>=13,<14",
]
# Plusieurs Go de roues et de modeles, tenus a l'ecart du socle : la suite
# par defaut tourne sans eux (imports paresseux dans ner_models.py, import
# garde dans ner_detect.py).
#
# huggingface_hub est importe directement par ner_models.py pour resoudre
# les instantanes de modeles : il arrivait en dependance transitive, donc
# non declare et libre de disparaitre a la prochaine resolution.
ner = [
    "transformers>=4.57,<5",
    "torch>=2.10,<3",
    "gliner>=0.2.25,<0.3",
    "flair>=0.15,<0.16",
    "huggingface_hub>=0.36,<1",
]

[project.scripts]
teille-douce = "teille_douce.launcher:main"

[project.urls]
Homepage = "https://github.com/rayondemiel/TEIlle-douce"

[tool.setuptools.dynamic]
version = {attr = "teille_douce.__version__"}

# Un seul paquet de premier niveau, et il est distinctif. C'est ce qui rend
# la table [project] ci-dessus possible : les sous-paquets s'appelaient
# `metadata`, `utils` et `lang`, que la decouverte automatique aurait
# publies a la racine de site-packages.
[tool.setuptools.packages.find]
include = ["teille_douce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not e2e_full'"
markers = [
    "e2e: bout en bout, mode court (TEI de base, sans reseau, ~1 s)",
    "e2e_full: bout en bout, mode complet (annotations linguistiques ; exige PyHellen et VieuxParler)",
]

[tool.coverage.run]
source = ["teille_douce", "main", "scripts"]
# teille_douce/odd/build.py pilote une chaine externe -- telechargements,
# XSLT Saxon, boite a outils TEI -- et ne peut pas s'executer dans la
# suite. Seuls ses helpers purs `without_the_date` et `Toolchain` sont
# exerces, par tests/test_odd.py et tests/test_cli_odd.py. simplify.py,
# lui, est de la logique pure et reste mesure. Les trois fichiers de
# scripts/ ne sont plus que des lanceurs d'une ligne, hors mesure comme
# le reste de scripts/.
#
# cli/fixture.py a ete retire de cette liste : il y etait entre avec le
# script dont il vient, et tests/test_cli_fixture.py l'exerce -- l'omettre
# soustrayait au cliquet du code effectivement teste, et surtout mesure.
omit = ["tests/*", "venv/*", "scripts/*", "*/teille_douce/odd/build.py"]
# sourcedoc/builder.py execute du code dans des workers multiprocessing :
# sans ces deux options, coverage ne voit pas les lignes exercees dans les forks.
# Consequence : lancer `coverage combine` avant `coverage report`.
concurrency = ["multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = false
skip_covered = false
# precision = 1 rend le cliquet reellement contraignant : avec la precision
# par defaut (0), coverage arrondit le total AVANT de le comparer a
# fail_under, et 80.51 % passerait une barre a "80.7".
precision = 1
# Cliquet : relever ce seuil a chaque lot de tests livre.
# Baseline mesuree le 2026-08-26 : 28 %. Lot 1 (teiheader, sourcedoc, metadata) : 44 %. Lot 2 (body, reconstructor) : 54 %. Fixture E2E (main.py mesure) : 61 %. Lot 3 (pile NER) : 80 %. PR fiabilite des runs + correctifs de review : 81 %. PR ids deterministes (golden strict, pipeline.py entre en mesure) : 82.7 %. PR validateur (validate_tei.py couvert) : 83.9 %. PR perf + suppressions de code mort : 84.7 %. PR enrichissement async : 86.3 %. PR consolidation architecture : 87 %. PR csv_book + validite tei_all : 87.2 %. PR modernisation + correctifs de review : 87.3 %. PR dependances epinglees et surcharges d env : 87.4 %. Correctifs de review (validation des valeurs d env) : 87.7 %. PR front/figures/heads : 87.9 %. PR notes marginales + verite du header : 88.1 %. PR pertes silencieuses corps/reconstructeur : 88.2 %. PR dates normalisees + jeu d etiquettes : 88.3 %. PR standOff : 88.3 %. PR cesure partagee + decoupe de config : 88.45 %. PR dates incertaines + prose d'apres config + pertes de modernisation signalees : 89.3 %. PR ODD du projet + correctifs de revue : 89.5 %. PR pages de meme numero : 89.6 %. PR objet Settings (config.py devient un fournisseur pur) : 89.8 %. PR surface d'arguments de run : 89.9 %. Correctifs de revue (codes de sortie testes de bout en bout) : 90.4 %. Vingt-quatre passes de revue sur la surface d'options : 90.5 %. PR rapport de run + tableau de bord : 92.5 % (mesure 92.8-93.1 ; la mesure varie d'un quart de point d'un run a l'autre selon le nombre de fichiers de donnees que les workers et les sous-processus E2E laissent, donc le seuil garde une marge reelle plutot que le dernier chiffre lu).
# Le seuil se compare a l'affichage ARRONDI (precision = 1) : un seuil a
# deux decimales est inatteignable — 88.31 refuse un total affiche 88.3.
fail_under = 92.9
