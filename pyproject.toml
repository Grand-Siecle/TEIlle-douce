# Pas de table [project] ici : le depot s'execute (`python3 main.py`), il
# ne s'installe pas — config.py et main.py vivent a la racine, hors de
# tout paquet. En declarer une ferait croire le contraire a l'outillage
# (uv, pip install -e .), qui construirait une roue publiant `metadata`,
# `utils` et `lang` au premier niveau de site-packages. La version de
# Python exigee est dans requirements.txt, la ou pip la lit vraiment.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not e2e_full'"
markers = [
    "e2e: bout en bout, mode court (TEI de base, sans reseau, ~1 s)",
    "e2e_full: bout en bout, mode complet (annotations linguistiques ; exige PyHellen et VieuxParler)",
]

[tool.coverage.run]
source = ["src", "main", "config", "scripts"]
omit = ["tests/*", "venv/*", "scripts/build_test_fixture.py"]
# sourcedoc/builder.py execute du code dans des workers multiprocessing :
# sans ces deux options, coverage ne voit pas les lignes exercees dans les forks.
# Consequence : lancer `coverage combine` avant `coverage report`.
concurrency = ["multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = false
skip_covered = false
# precision = 1 rend le cliquet reellement contraignant : avec la precision
# par defaut (0), coverage arrondit le total AVANT de le comparer a
# fail_under, et 80.51 % passerait une barre a "80.7".
precision = 1
# Cliquet : relever ce seuil a chaque lot de tests livre.
# Baseline mesuree le 2026-08-26 : 28 %. Lot 1 (teiheader, sourcedoc, metadata) : 44 %. Lot 2 (body, reconstructor) : 54 %. Fixture E2E (main.py mesure) : 61 %. Lot 3 (pile NER) : 80 %. PR fiabilite des runs + correctifs de review : 81 %. PR ids deterministes (golden strict, pipeline.py entre en mesure) : 82.7 %. PR validateur (validate_tei.py couvert) : 83.9 %. PR perf + suppressions de code mort : 84.7 %. PR enrichissement async : 86.3 %. PR consolidation architecture : 87 %. PR csv_book + validite tei_all : 87.2 %. PR modernisation + correctifs de review : 87.3 %. PR dependances epinglees et surcharges d env : 87.4 %. Correctifs de review (validation des valeurs d env) : 87.7 %. PR front/figures/heads : 87.9 %. PR notes marginales + verite du header : 88.1 %. PR pertes silencieuses corps/reconstructeur : 88.2 %. PR dates normalisees + jeu d etiquettes : 88.3 %. PR standOff : 88.3 %. PR cesure partagee + decoupe de config : 88.45 %. PR dates incertaines + prose d'apres config + pertes de modernisation signalees : 89.3 %.
# Le seuil se compare a l'affichage ARRONDI (precision = 1) : un seuil a
# deux decimales est inatteignable — 88.31 refuse un total affiche 88.3.
fail_under = 89.3
