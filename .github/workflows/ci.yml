name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Python 3.12 obligatoire : en 3.10, pip resout lingua-language-detector
      # 2.1.1 (au lieu de 2.2.0), la detection de langue change et la
      # comparaison au golden E2E casse (usage= differents dans <langUsage>).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev.txt = deps de base + pytest/coverage. Les deps NER
      # (torch, transformers, ...) restent dans requirements-ner.txt : la
      # suite par defaut tourne sans modeles ni reseau, et e2e_full est
      # deselectionne par les addopts de pyproject.toml.
      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      # Le schema TEI (~1 Mo) n'est pas versionne : sans lui les tests de
      # validation se contentent de se sauter, et la conformite du pipeline
      # ne serait verifiee par rien. Mis en cache par version de schema.
      - name: Cache du schema TEI
        id: cache-tei-rng
        uses: actions/cache@v4
        with:
          path: tei_all.rng
          key: tei-all-rng-current
      - name: Telecharger tei_all.rng
        if: steps.cache-tei-rng.outputs.cache-hit != 'true'
        run: curl -sSL --retry 3 --max-time 120 -o tei_all.rng
          https://tei-c.org/release/xml/tei/custom/schema/relaxng/tei_all.rng

      # `combine` est obligatoire : les workers multiprocessing et les
      # sous-processus E2E ecrivent chacun leur fichier de donnees.
      # `report` applique le cliquet fail_under de pyproject.toml.
      - name: Tests + couverture (cliquet)
        run: |
          coverage run -m pytest
          coverage combine
          coverage report
